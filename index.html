<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ใบนัด — TERMINAL 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bezel:#1b1d22;
    --bezel-2:#101114;
    --screen-a:#0b1a5e;
    --screen-b:#173a9e;
    --screen-edge:#040a2c;
    --txt:#eaf1ff;
    --txt-dim:#8fa3e0;
    --cyan:#5fe0ff;
    --amber:#ffd166;
    --red:#ff5a4e;
    --green:#7dffb0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 20%, #33363e, #0d0e11 75%);
    font-family:'Chakra Petch',monospace;
    color:var(--txt);
    overflow:hidden;
  }

  /* ===== monitor bezel ===== */
  .monitor{
    width:min(480px, 94vw);
    background:
      linear-gradient(155deg, #2a2c33, var(--bezel) 40%, var(--bezel-2));
    border-radius:26px;
    padding:22px 22px 34px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 0 -2px 0 rgba(0,0,0,.4);
    position:relative;
  }
  .monitor::before{
    content:"";
    position:absolute; inset:0;
    border-radius:26px;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px);
    pointer-events:none;
  }
  .bezel-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 6px 14px;
  }
  .led{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 6px 2px rgba(125,255,176,.7);
    animation:blink 2.2s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .brand{
    font-size:10.5px;
    letter-spacing:2px;
    color:#8a8d97;
  }

  /* ===== screen ===== */
  .screen{
    position:relative;
    border-radius:10px;
    background:
      radial-gradient(120% 140% at 30% 0%, var(--screen-b), var(--screen-a) 55%, var(--screen-edge) 100%);
    box-shadow:
      inset 0 0 0 2px rgba(0,0,0,.5),
      inset 0 0 60px rgba(0,0,0,.55);
    height:540px;
    overflow:hidden;
    padding:20px 18px 16px;
    display:flex;
    flex-direction:column;
  }
  .screen::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
    pointer-events:none;
  }
  .screen::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12px;
    color:var(--txt-dim);
    letter-spacing:1px;
    border-bottom:1px solid rgba(255,255,255,.15);
    padding-bottom:10px;
    margin-bottom:10px;
    z-index:1;
  }
  .topbar b{ color:var(--cyan); font-weight:600; }
  .punch-row{ display:flex; gap:6px; }
  .punch{
    width:10px; height:10px;
    border:1.5px solid var(--txt-dim);
    transform:rotate(45deg);
  }
  .punch.filled{
    background:var(--cyan);
    border-color:var(--cyan);
    box-shadow:0 0 6px 1px rgba(95,224,255,.6);
  }

  .content{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    text-align:center;
    position:relative;
    z-index:1;
  }
  .content.shift{ animation:content-in .35s ease; }
  @keyframes content-in{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .prompt{
    font-size:11px;
    color:var(--txt-dim);
    letter-spacing:1px;
  }
  .stage-title{
    font-size:21px;
    font-weight:700;
    color:var(--txt);
    text-shadow:0 0 10px rgba(95,224,255,.35);
  }
  .stage-sub{
    font-size:13px;
    color:var(--txt-dim);
    max-width:280px;
    line-height:1.6;
  }

  /* ---- stamp stage ---- */
  .stamp-zone{
    width:140px; height:140px;
    border:2.5px dashed var(--cyan);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    opacity:.6;
  }
  .stamp-zone-label{ font-size:10px; color:var(--cyan); letter-spacing:1px; }
  .stamper{
    position:absolute; top:-180px; left:50%;
    transform:translateX(-50%);
    width:88px;
    transition:transform .16s cubic-bezier(.5,0,.7,1);
  }
  .stamper.hit{
    transform:translateX(-50%) translateY(198px) scale(.97);
    transition:transform .09s cubic-bezier(.8,0,1,1);
  }
  .stamper.retract{
    transform:translateX(-50%) translateY(0);
    transition:transform .3s cubic-bezier(.2,.8,.4,1) .05s;
  }
  .imprint{
    position:absolute;
    width:140px; height:140px;
    border-radius:50%;
    border:5px solid var(--red);
    color:var(--red);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    opacity:0;
    transform:scale(1.5) rotate(-8deg);
    font-weight:700;
  }
  .imprint.show{ animation:stamp-thud .28s cubic-bezier(.2,.9,.3,1) forwards; }
  @keyframes stamp-thud{
    0%{ opacity:0; transform:scale(1.6) rotate(-8deg); }
    55%{ opacity:.95; transform:scale(.94) rotate(-8deg); }
    100%{ opacity:.95; transform:scale(1) rotate(-8deg); }
  }
  .imprint span{ font-size:15px; }
  .imprint small{ font-size:9px; letter-spacing:1px; margin-top:2px; }
  .shake{ animation:shake .28s ease; }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px);} 20%,80%{ transform:translateX(2px);}
    30%,50%,70%{ transform:translateX(-4px);} 40%,60%{ transform:translateX(4px);}
  }

  /* ---- photo stage ---- */
  .viewfinder{ width:170px; height:170px; position:relative; display:flex; align-items:center; justify-content:center; }
  .vf-corner{ position:absolute; width:24px; height:24px; border-color:var(--cyan); border-style:solid; border-width:0; }
  .vf-tl{ top:0; left:0; border-top-width:3px; border-left-width:3px; }
  .vf-tr{ top:0; right:0; border-top-width:3px; border-right-width:3px; }
  .vf-bl{ bottom:0; left:0; border-bottom-width:3px; border-left-width:3px; }
  .vf-br{ bottom:0; right:0; border-bottom-width:3px; border-right-width:3px; }
  .vf-face{ font-size:52px; }
  #camVideo, #capturedImg{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:6px;
  }
  #camVideo{ transform:scaleX(-1); }
  .cam-btn{
    font-family:'Chakra Petch',monospace;
    font-size:12px;
    padding:9px 18px;
    border-radius:6px;
    border:1.5px solid var(--cyan);
    background:rgba(95,224,255,.08);
    color:var(--txt);
    cursor:pointer;
    letter-spacing:.5px;
  }
  .cam-btn:hover{ background:rgba(95,224,255,.18); }
  .cam-btn:active{ transform:scale(.96); }
  .cam-note{ font-size:10.5px; color:var(--txt-dim); max-width:250px; }

  /* ---- printing stage (card ejects like a real ticket printer) ---- */
  .printer{ position:relative; width:140px; height:118px; display:flex; justify-content:center; }
  .printer-slot{
    position:absolute; top:6px;
    width:122px; height:14px;
    background:#04102e;
    border:2px solid var(--cyan);
    border-radius:4px;
    box-shadow:inset 0 3px 6px rgba(0,0,0,.6);
    z-index:2;
  }
  .ticket{
    position:absolute; top:8px;
    width:112px; height:74px;
    background:#eef3ff;
    color:#0b1a5e;
    border-radius:6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:translateY(-72px);
    transition:transform 1.1s cubic-bezier(.25,.85,.3,1);
    box-shadow:0 6px 16px rgba(0,0,0,.45);
    z-index:1;
  }
  .ticket.eject{ transform:translateY(34px); }
  .ticket-label{ font-size:8px; letter-spacing:1.5px; color:#5c6f6a; font-weight:600; }
  .ticket-no{ font-size:22px; letter-spacing:3px; font-weight:700; }
  .ticket-sub{ font-size:7px; color:#8fa3e0; margin-top:3px; letter-spacing:.5px; }
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:80; border-radius:10px; }
  .flash.pop{ animation:flash-pop .4s ease; }
  @keyframes flash-pop{ 0%{opacity:0;} 10%{opacity:1;} 30%{opacity:.85;} 45%{opacity:.15;} 60%{opacity:.55;} 100%{opacity:0;} }

  /* ---- card issue stage (3 digit entry) ---- */
  .digit-row{ display:flex; gap:12px; }
  .digit-box{
    width:44px; height:56px;
    border:2px solid var(--cyan);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    font-weight:700;
    color:var(--txt);
    background:rgba(95,224,255,.06);
  }
  .digit-box.cursor{ box-shadow:0 0 0 2px rgba(95,224,255,.5); }
  .digit-box.err{ border-color:var(--red); animation:shake .28s ease; }
  .card-error{ font-size:12px; color:var(--red); height:14px; }

  /* ---- processing: long white rectangle bar ---- */
  .bar-outer{
    width:260px; height:26px;
    border:2px solid var(--txt);
    border-radius:3px;
    padding:3px;
    background:rgba(0,0,0,.25);
  }
  .bar-inner{
    height:100%;
    width:0%;
    background:#fff;
    box-shadow:0 0 10px rgba(255,255,255,.7);
    transition:width 1s linear;
  }
  .bar-label{ font-size:12px; color:var(--txt-dim); letter-spacing:1px; }

  /* ---- result stage ---- */
  .med-icon{ font-size:50px; }
  .med-name{ font-size:18px; font-weight:700; color:var(--amber); text-shadow:0 0 8px rgba(255,209,102,.4); }

  /* ---- treat stage ---- */
  .treat-row{ display:flex; align-items:center; gap:18px; font-size:38px; position:relative; }
  .treat-pill{ transition:transform .5s cubic-bezier(.3,.8,.3,1), opacity .5s ease; }
  .treat-pill.fly{ transform:translateX(44px) translateY(-8px) scale(.7); opacity:0; }
  .sparkle{ position:absolute; font-size:20px; opacity:0; }
  .sparkle.go{ animation:sparkle-pop .6s ease forwards; }
  @keyframes sparkle-pop{
    0%{ opacity:0; transform:scale(.3) translateY(0); }
    40%{ opacity:1; }
    100%{ opacity:0; transform:scale(1.3) translateY(-22px); }
  }

  /* ---- success stage ---- */
  .success-box{
    width:170px; height:170px;
    border-radius:14px;
    border:5px solid var(--green);
    color:var(--green);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    transform:scale(1.6) rotate(4deg);
    opacity:0;
    font-weight:700;
    animation:stamp-thud2 .3s cubic-bezier(.2,.9,.3,1) forwards;
  }
  @keyframes stamp-thud2{
    0%{ opacity:0; transform:scale(1.7) rotate(4deg); }
    55%{ opacity:1; transform:scale(.95) rotate(4deg); }
    100%{ opacity:1; transform:scale(1) rotate(4deg); }
  }
  .success-box span{ font-size:26px; }
  .success-box small{ font-size:10px; letter-spacing:2px; margin-top:4px; }

  /* ---- footer key hint (outside screen, on bezel) ---- */
  .footer{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:16px;
  }
  .key{
    font-size:11px; letter-spacing:1px; color:#c7c9d1;
    padding:6px 16px; border:1.5px solid #55575f; border-radius:6px;
    background:#25262c;
  }
  .key.pulse{ animation:key-pulse 1.3s ease-in-out infinite; }
  @keyframes key-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(95,224,255,0); }
    50%{ box-shadow:0 0 0 6px rgba(95,224,255,.22); }
  }
  .footer-note{ font-size:11px; color:#9a9ca5; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
  @media (max-width:420px){ .screen{ height:520px; } }
</style>
</head>
<body>

<div class="monitor">
  <div class="bezel-top">
    <div class="led"></div>
    <div class="brand">GREEN LEAF CLINIC · TERMINAL 01</div>
    <div style="width:8px"></div>
  </div>

  <div class="screen">
    <div class="topbar">
      <div>ROUND <b id="roundNum">1</b></div>
      <div class="punch-row" id="punchRow"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="flash" id="flash"></div>
  </div>

  <div class="footer">
    <div class="key" id="keyHint">SPACE</div>
    <div class="footer-note" id="footerNote">กดเพื่อดำเนินการ</div>
  </div>
</div>

<script>
(function(){
  const contentEl = document.getElementById('content');
  const roundNumEl = document.getElementById('roundNum');
  const punchRow = document.getElementById('punchRow');
  const keyHint = document.getElementById('keyHint');
  const footerNote = document.getElementById('footerNote');
  const flashEl = document.getElementById('flash');

  const MEDS = [
    { icon:'💊', name:'ยาแก้ปวด' },
    { icon:'🩹', name:'พันแผล' },
    { icon:'🧪', name:'วิตามินซี' },
    { icon:'🌡️', name:'ยาลดไข้' },
    { icon:'💉', name:'ฉีดวัคซีน' },
    { icon:'🧊', name:'ประคบเย็น' },
    { icon:'🍯', name:'ยาแก้ไอ' },
  ];

  let round = 1;
  let stage = 'STAMP'; // STAMP -> PHOTO -> CARD -> PROCESSING -> RESULT -> TREATING -> SUCCESS
  let currentMed = null;
  let acceptInput = false;
  let punches = [];
  let cardDigits = [];
  let camStream = null;
  let camState = 'idle'; // idle -> starting -> live -> error

  /* ---------- sound (Web Audio, synthesized, no files needed) ---------- */
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq=880, duration=0.08, type='square', vol=0.15, delay=0){
    ensureAudio();
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }
  function thud(){
    ensureAudio();
    const dur = 0.15;
    const bufferSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 3);
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 350;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.5;
    noise.connect(filter).connect(gain).connect(audioCtx.destination);
    noise.start();
  }
  function shutterSound(){
    beep(2200, 0.02, 'square', 0.18, 0);
    beep(500, 0.05, 'square', 0.14, 0.05);
  }
  function successChime(){
    beep(660, 0.09, 'square', 0.12, 0);
    beep(880, 0.09, 'square', 0.12, 0.1);
    beep(1100, 0.14, 'square', 0.12, 0.2);
  }
  function keyClick(){
    beep(1400, 0.03, 'square', 0.08, 0);
  }
  function errBuzz(){
    beep(160, 0.18, 'sawtooth', 0.12, 0);
  }

  /* ---------- helpers ---------- */
  function updatePunches(){
    punchRow.innerHTML = '';
    const show = punches.slice(-5);
    while(show.length < 5) show.unshift(null);
    show.forEach((v)=>{
      const d = document.createElement('div');
      d.className = 'punch' + (v ? ' filled' : '');
      punchRow.appendChild(d);
    });
  }
  function setFooter(text, active){
    footerNote.textContent = text;
    keyHint.classList.toggle('pulse', !!active);
  }
  function render(html){
    contentEl.classList.remove('shift');
    contentEl.innerHTML = html;
    void contentEl.offsetWidth;
    contentEl.classList.add('shift');
  }
  function stamperSVG(){
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
      <rect x="30" y="0" width="40" height="18" rx="6" fill="#0b1a5e"/>
      <rect x="38" y="18" width="24" height="46" rx="4" fill="#5fe0ff" opacity="0.5"/>
      <rect x="15" y="64" width="70" height="26" rx="6" fill="#0b1a5e"/>
      <ellipse cx="50" cy="112" rx="34" ry="14" fill="#ff5a4e"/>
      <ellipse cx="50" cy="108" rx="34" ry="14" fill="#ff6f63"/>
    </svg>`;
  }

  /* ---------- STAGE 1: stamp ---------- */
  function goStamp(){
    stage = 'STAMP';
    roundNumEl.textContent = round;
    render(`
      <div class="prompt">&gt; SYSTEM: ตรวจสอบใบนัดหมาย</div>
      <div class="stage-title">ปั๊มสแตมป์ใบนัด</div>
      <div class="stage-sub">ตรวจสอบเรียบร้อย กด SPACE เพื่อประทับตรา</div>
      <div class="stamp-zone">
        <div class="stamp-zone-label">ปั๊มตรงนี้</div>
        <div class="imprint" id="imprint"><span>✓</span><small>ตรวจแล้ว</small></div>
      </div>
      <img class="stamper" id="stamper" alt="stamp"
        src="data:image/svg+xml;utf8,${encodeURIComponent(stamperSVG())}" />
    `);
    acceptInput = true;
    setFooter('กด SPACE เพื่อปั๊มตรา', true);
  }
  function doStamp(){
    if(!acceptInput || stage !== 'STAMP') return;
    acceptInput = false;
    thud();
    setFooter('กำลังปั๊มตรา...', false);
    const stamper = document.getElementById('stamper');
    const imprint = document.getElementById('imprint');
    const screenEl = document.querySelector('.screen');
    stamper.classList.add('hit');
    setTimeout(()=>{
      imprint.classList.add('show');
      screenEl.classList.add('shake');
      setTimeout(()=>{
        stamper.classList.remove('hit');
        stamper.classList.add('retract');
        screenEl.classList.remove('shake');
      }, 90);
    }, 160);
    setTimeout(()=> goPhoto(), 900);
  }

  /* ---------- STAGE 2: photo (flash + sound) ---------- */
  function goPhoto(){
    stage = 'PHOTO';
    render(`
      <div class="prompt">&gt; SYSTEM: ยืนยันตัวตนด้วยภาพถ่าย</div>
      <div class="stage-title">ถ่ายรูปยืนยันตัวตน</div>
      <div class="stage-sub">มองกล้อง แล้วกด SPACE เพื่อถ่ายภาพ</div>
      <div class="viewfinder">
        <div class="vf-corner vf-tl"></div><div class="vf-corner vf-tr"></div>
        <div class="vf-corner vf-bl"></div><div class="vf-corner vf-br"></div>
        <div class="vf-face" id="vfFace">🙂</div>
      </div>
    `);
    acceptInput = true;
    setFooter('กด SPACE เพื่อถ่ายภาพ', true);
  }
  function doPhoto(){
    if(!acceptInput || stage !== 'PHOTO') return;
    acceptInput = false;
    shutterSound();
    setFooter('ถ่ายภาพ...', false);
    flashEl.classList.remove('pop'); void flashEl.offsetWidth;
    flashEl.classList.add('pop');
    const face = document.getElementById('vfFace');
    if(face) face.textContent = '😊';
    setTimeout(()=> goCard(), 500);
  }

  /* ---------- STAGE 3: issue card via 3-digit entry ---------- */
  function renderDigits(errState){
    let boxes = '';
    for(let i=0;i<3;i++){
      const has = cardDigits[i] !== undefined;
      const isCursor = i === cardDigits.length;
      boxes += `<div class="digit-box${isCursor ? ' cursor' : ''}${errState ? ' err' : ''}">${has ? cardDigits[i] : ''}</div>`;
    }
    return boxes;
  }
  function goCard(){
    stage = 'CARD';
    cardDigits = [];
    render(`
      <div class="prompt">&gt; SYSTEM: ออกบัตรคิว</div>
      <div class="stage-title">พิมพ์เลขบัตร 3 หลัก</div>
      <div class="stage-sub">กดตัวเลข 0-9 ให้ครบ 3 หลัก แล้วกด SPACE เพื่อออกบัตร</div>
      <div class="digit-row" id="digitRow">${renderDigits(false)}</div>
      <div class="card-error" id="cardError"></div>
    `);
    acceptInput = true;
    setFooter('พิมพ์เลข 3 หลัก แล้วกด SPACE', true);
  }
  function typeDigit(d){
    if(stage !== 'CARD' || !acceptInput) return;
    if(cardDigits.length >= 3) return;
    keyClick();
    cardDigits.push(d);
    const row = document.getElementById('digitRow');
    if(row) row.innerHTML = renderDigits(false);
  }
  function backspaceDigit(){
    if(stage !== 'CARD' || !acceptInput) return;
    if(cardDigits.length === 0) return;
    cardDigits.pop();
    const row = document.getElementById('digitRow');
    if(row) row.innerHTML = renderDigits(false);
  }
  function confirmCard(){
    if(stage !== 'CARD' || !acceptInput) return;
    if(cardDigits.length < 3){
      errBuzz();
      const row = document.getElementById('digitRow');
      const err = document.getElementById('cardError');
      if(row) row.innerHTML = renderDigits(true);
      if(err) err.textContent = 'กรุณากรอกให้ครบ 3 หลัก';
      return;
    }
    acceptInput = false;
    keyClick();
    setFooter('กำลังออกบัตร...', false);
    setTimeout(()=> goProcessing(), 400);
  }

  /* ---------- processing: long white rectangle bar, 7s ---------- */
  function goProcessing(){
    stage = 'PROCESSING';
    const total = 7;
    const cardNo = cardDigits.join('');
    render(`
      <div class="prompt">&gt; SYSTEM: บัตรคิวหมายเลข ${cardNo}</div>
      <div class="stage-title">กำลังประมวลผล</div>
      <div class="stage-sub">ระบบกำลังตรวจสอบข้อมูลคนไข้ กรุณารอสักครู่</div>
      <div class="bar-outer"><div class="bar-inner" id="barInner"></div></div>
      <div class="bar-label" id="barLabel">LOADING... ${total}s</div>
    `);
    acceptInput = false;
    setFooter('โปรดรอ...', false);

    let left = total;
    const barInner = document.getElementById('barInner');
    const barLabel = document.getElementById('barLabel');
    const tick = ()=>{
      const done = total - left;
      const pct = Math.round((done/total)*100);
      barInner.style.width = pct + '%';
      barLabel.textContent = left > 0 ? `LOADING... ${left}s` : 'DONE';
      if(left <= 0){
        clearInterval(timer);
        setTimeout(()=> goResult(), 300);
        return;
      }
      left -= 1;
    };
    tick();
    const timer = setInterval(tick, 1000);
  }

  /* ---------- result ---------- */
  function goResult(){
    stage = 'RESULT';
    currentMed = MEDS[Math.floor(Math.random()*MEDS.length)];
    render(`
      <div class="prompt">&gt; SYSTEM: ผลตรวจ</div>
      <div class="stage-title">ผลตรวจออกแล้ว</div>
      <div class="med-icon">${currentMed.icon}</div>
      <div class="med-name">${currentMed.name}</div>
      <div class="stage-sub">กด SPACE 1 ครั้งเพื่อทำการรักษา</div>
    `);
    acceptInput = true;
    setFooter('กด SPACE เพื่อรักษา', true);
  }
  function doTreat(){
    if(!acceptInput || stage !== 'RESULT') return;
    acceptInput = false;
    stage = 'TREATING';
    setFooter('กำลังรักษา...', false);
    render(`
      <div class="prompt">&gt; SYSTEM: กำลังให้การรักษา</div>
      <div class="stage-title">${currentMed.name}</div>
      <div class="treat-row">
        <div class="treat-pill" id="pill">${currentMed.icon}</div>
        <div>🧑‍⚕️</div>
        <div class="sparkle" id="sparkle" style="left:70%;top:-10px;">✨</div>
      </div>
    `);
    setTimeout(()=>{
      const pill = document.getElementById('pill');
      const sparkle = document.getElementById('sparkle');
      if(pill) pill.classList.add('fly');
      if(sparkle) sparkle.classList.add('go');
    }, 150);
    setTimeout(()=> goSuccess(), 900);
  }

  /* ---------- success ---------- */
  function goSuccess(){
    stage = 'SUCCESS';
    successChime();
    render(`
      <div class="prompt">&gt; SYSTEM: บันทึกผลสำเร็จ</div>
      <div class="stage-title">การรักษาสำเร็จ</div>
      <div class="success-box"><span>✓</span><small>สำเร็จ</small></div>
    `);
    setFooter('เตรียมคนไข้รายต่อไป...', false);
    punches.push(true);
    updatePunches();
    setTimeout(()=>{
      round += 1;
      goStamp();
    }, 1300);
  }

  /* ---------- input handling ---------- */
  function handleKey(e){
    if(e.code === 'Space'){
      e.preventDefault();
      if(stage === 'STAMP') doStamp();
      else if(stage === 'PHOTO') doPhoto();
      else if(stage === 'CARD') confirmCard();
      else if(stage === 'RESULT') doTreat();
      return;
    }
    if(stage === 'CARD'){
      if(/^[0-9]$/.test(e.key)){ typeDigit(e.key); }
      else if(e.key === 'Backspace'){ backspaceDigit(); }
    }
  }
  window.addEventListener('keydown', handleKey);
  contentEl.addEventListener('click', ()=>{
    if(stage === 'STAMP') doStamp();
    else if(stage === 'PHOTO') doPhoto();
    else if(stage === 'RESULT') doTreat();
  });

  updatePunches();
  goStamp();
})();
</script>
</body>
</html>
